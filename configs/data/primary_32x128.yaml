# Primary paired dataset: 32 x 32 coarse -> 128 x 128 fine (D008).
#
# The shared time step is derived from the fine grid's CFL bound at generation time rather
# than hard-coded here, so it stays consistent with the resolved config (docs/DATASET.md
# requires computing the actual CFL bound). For this pair it works out to 25.1398 s,
# giving a saved interval of 603.36 s.
#
# Trajectories run to step 4992, matching the 4999 updates the reference swe.py performs
# (D017). That is 34.86 h of physical time and 197 saved snapshots.
#
# Payload: 48 trajectories x 197 snapshots x 3 channels, float32 -> 1.840 GiB before
# compression, still inside the sub-2-GiB raw target in docs/PROJECT_SPEC.md.

dataset_id: swe_gaussian_32x128_v1
pair_id: swe_gaussian_32x128_v1
resolution_family: swe_gaussian_x4

coarse_nodes: 32
fine_nodes: 128

# Spin-up discard, then 197 evenly spaced saves: last step is 288 + 24 * 196 = 4992.
discard_steps: 288
sample_stride: 24
snapshot_count: 197

output_root: data
registry_path: data/registries/ic_registry_v1.json

# Evaluate diagnostics every 8th step: dense enough to catch a divergence early, cheap
# enough not to dominate a 3336-step run.
diagnostic_stride: 8
