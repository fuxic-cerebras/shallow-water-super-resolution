# Backup paired dataset: 64 x 64 coarse -> 256 x 256 fine (D008).
#
# A separate release from the primary. It shares the IC registry and splits but NOT the
# manifest, normalization statistics, time step, checkpoints, or training runs, and the
# two must never be mixed in one training run (docs/DATASET.md).
#
# The shared time step here is 12.5206 s, half the primary's only approximately: the
# spacing ratio is 127/255, not exactly 1/2, so the saved interval is 600.99 s against
# the primary's 603.36 s. That 0.392 percent mismatch is recorded in the Open Questions
# section of docs/PROJECT_SPEC.md and matters for any cross-resolution comparison.
#
# The stride of 48 against the primary's 24 is what makes the two pairs comparable: this
# pair's dt is half the primary's because its fine grid has half the spacing, so twice the
# steps are needed to cover the same physical time. Doubling both the stride and the step
# cap keeps the saved times and the frame count aligned with the primary (D017): 197
# snapshots to step 9984, which is 34.72 h against the primary's 34.86 h.
#
# Payload: 7.359 GiB before compression, and roughly eight times the primary's solver
# work (four times the grid points, twice the steps).

dataset_id: swe_gaussian_64x256_v1
pair_id: swe_gaussian_64x256_v1
resolution_family: swe_gaussian_x4

coarse_nodes: 64
fine_nodes: 256

# Last step is 576 + 48 * 196 = 9984, giving 34.72 h of physical time.
discard_steps: 576
sample_stride: 48
snapshot_count: 197

output_root: data
registry_path: data/registries/ic_registry_v1.json

diagnostic_stride: 16
