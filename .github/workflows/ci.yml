name: CI

# CPU-only CI, matching the project's actual training target: no CUDA device is
# reachable on any partition (D015), so nothing here needs or assumes a GPU.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Lint, type-check, fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The solver reference is a pinned submodule (D010). Without it the parity
          # tests cannot run at all, so this is required rather than optional.
          # Cross-repository submodule checkout needs a token with read access to
          # fuxic-cerebras/shallow-water; the default GITHUB_TOKEN is scoped to this
          # repository only.
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU wheels only; the CUDA build is a large download and never exercised.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      # Single source of truth: the same script developers run locally, so CI and local
      # checks cannot drift. It also guards the .gitignore anchoring bug that once hid
      # swe_sr/data and tests/data from ruff, making local lint pass over 17 of 25 files.
      - name: Checks
        run: ./scripts/check.sh
