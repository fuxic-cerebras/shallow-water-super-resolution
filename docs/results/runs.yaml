# Registry of every run the documentation cites, and the ONLY place a run ID is written by
# hand (D024). `python -m swe_sr.results --write` reads this, loads each run's
# `evaluation_*.json`, and writes `docs/results/index.json`; `python -m swe_sr.docgen` renders
# the documentation's tables from that index. Prose therefore never transcribes a number.
#
# `swe_sr/docgen.py` also fails if any document mentions a run ID absent from this file, so a
# run cannot be cited without being registered.
#
# Fields
#   id          index key, and the name block renderers use. Stable; not the model name, which
#               is not unique -- the weight-decay arm's model is `convmixer`, same as the
#               published arm it varies.
#   label       display name in rendered tables.
#   short       display name where the table is already about architectures and the "x4" is
#               redundant, as in the training-curve comparison. Defaults to `label`.
#   run_id      directory under runs/. Gitignored, so the artifacts are not in the repository;
#               the index built from them is.
#   role        primary | ablation | variant. `primary` arms appear in the headline table.
#   experiment  the TASKS.md task or decision this run belongs to.
#   frozen      true if `docs/EXPERIMENT_FREEZE.md` designates it. Frozen arms' rendered tables
#               are verified, never rewritten.
#   reference   the arm this one varies against, for the paired comparison. Omit for primaries.
schema: 1

arms:
