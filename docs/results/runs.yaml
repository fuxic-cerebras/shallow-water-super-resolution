# Lead-time bands used by the rendered by-band tables. Defined here rather than in the
# renderer so a change to a band boundary is a reviewable diff next to the runs it regroups.
#
# Intervals are half-open, `min <= t < max`, with `min` defaulting to 0 and `max` to infinity.
# The bands deliberately do not partition the range -- 12 to 16 h is omitted, as the existing
# tables omit it, because the bands are there to separate three regimes rather than to sum.
# `swe_sr/results.py` asserts that no snapshot's lead time falls exactly on a boundary, so the
# labels below ("<= 12 h" for a `t < 12` interval) describe the same set of snapshots either
# way; if a future grid puts a snapshot on 12.0 or 24.0 h, that assertion fails rather than
# silently moving it between bands.
lead_time_bands:
  - {label: "<= 12 h", max: 12.0}
  - {label: "16-24 h", min: 16.0, max: 24.0}
  - {label: "> 24 h", min: 24.0}
